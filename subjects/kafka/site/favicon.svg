<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Officina Academy — Apache Kafka">
  <!-- Teal rather than Kafka's own near-black: this tab sits next to the Java
       one more often than any other pair here, and a dark square disappears
       into a dark browser tab strip, which is the one place the icon has a job
       to do. An initial for the reason given in java/. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B5E75"/>
      <stop offset="1" stop-color="#17A2B8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <text x="32" y="46" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="800" fill="#ffffff">K</text>
</svg>
