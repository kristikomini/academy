<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Fonderia Academy — Java">
  <!-- An initial, not the full `mark` from subject.js: "Java" across 44px of
       artwork is 11px a letter here, which is under 3px in a 16px tab and
       reads as a smudge. The hue carries the identity at that size, the letter
       confirms it once the icon is large. Same reasoning in kafka/. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D2570A"/>
      <stop offset="1" stop-color="#F0921E"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <text x="32" y="46" text-anchor="middle"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="800" fill="#ffffff">J</text>
</svg>
