name: CI

# The gate exists to catch cross-references rotting. That only works if it runs
# on every change rather than when somebody remembers, so this is deliberately
# the first job and it has no dependencies to install.
on:
  push:
  pull_request:

jobs:
  # Its own job because it is one assertion about the repository as a whole,
  # not about any single subject: /engine is the source and every subject holds
  # a copy of it. Running it inside the matrix below would ask the same question
  # three times and report it three times.
  engine:
    name: Engine is in sync across every subject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: php tools/sync-engine.php --check

  # A matrix rather than three steps in one job, for the same reason the
  # unwritten jobs below are listed rather than omitted: the CI tab should say
  # WHICH subject is failing without anyone opening a log. Three named checks,
  # and they fail independently.
  #
  # This gated php alone until 2026-09-11, from when it was the only subject.
  # java and kafka were complete and ungated for four days — long enough to have
  # shipped a broken cross-reference with a green tick above it.
  integrity:
    name: Cross-references
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        subject: [php, java, kafka]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: tools/doctor.php ${{ matrix.subject }}
        run: php tools/doctor.php ${{ matrix.subject }}

  # Placeholders for the remaining blueprint §8 jobs. They are listed rather
  # than silently absent so the gap is visible in the CI tab, not just in prose.
  #
  #   unit          — PHPUnit against src/          (phase 7)
  #   integration   — PHPUnit + Testcontainers      (phase 7)
  #   labs-must-fail— the graded exercises stay red (phase 7)
  #   audit         — composer audit                (phase 7)
  #   mutation      — infection, weekly             (phase 7)
