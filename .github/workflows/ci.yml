name: CI

# The gate exists to catch cross-references rotting. That only works if it runs
# on every change rather than when somebody remembers, so this is deliberately
# the first job and it has no dependencies to install.
on:
  push:
  pull_request:

jobs:
  # Its own job because it is one assertion about the repository as a whole,
  # not about any single subject: /engine is the source and every subject holds
  # a copy of it. Running it inside the matrix below would ask the same question
  # three times and report it three times.
  engine:
    name: Engine is in sync across every subject
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: php tools/sync-engine.php --check

  # A matrix rather than three steps in one job, for the same reason the
  # unwritten jobs below are listed rather than omitted: the CI tab should say
  # WHICH subject is failing without anyone opening a log. Three named checks,
  # and they fail independently.
  #
  # This gated php alone until 2026-09-11, from when it was the only subject.
  # java and kafka were complete and ungated for four days — long enough to have
  # shipped a broken cross-reference with a green tick above it.
  integrity:
    name: Cross-references
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        subject: [php, java, kafka]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: tools/doctor.php ${{ matrix.subject }}
        run: php tools/doctor.php ${{ matrix.subject }}

  # Is there a Cloudflare token to deploy WITH?
  #
  # Its own job because the `secrets` context is not available in a job-level
  # `if:`, so the question cannot be asked where the answer is needed. Asking it
  # here and passing a plain true/false down through `needs` is the way to get a
  # deploy that SKIPS when the repository has no token, instead of one that runs
  # and fails red on every push until somebody adds one.
  #
  # It prints whether the secret is set, never the secret.
  secrets-present:
    name: Deploy credentials present
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is set — deploy will run."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is not set — deploy will be skipped."
            echo "Add it under Settings → Secrets and variables → Actions."
          fi

  # Push to main deploys. Anything else does not.
  #
  # `needs` is the whole point: this runs only after sync-engine and all three
  # doctor runs are green, so the gate is not decoration. A broken cross-
  # reference now stops the deploy instead of being published and noticed later.
  #
  # ALL THREE SUBJECTS, EVERY TIME, deliberately — no path filter. It looks
  # wasteful and is not: a change under engine/ or tools/ reaches every subject
  # through sync-engine.php, so any filter honest enough to catch that would
  # fire on nearly every push anyway. Cloudflare uploads only the assets whose
  # hashes changed (the last manual deploy sent 71 of 91 files), so an unchanged
  # subject costs about fifteen seconds and republishes byte-identical content.
  #
  # WHAT THIS DOES NOT DEPLOY: subjects/java/api and subjects/java/src. Those are
  # Spring Boot and Workers runs V8 isolates. See the note in wrangler.jsonc.
  deploy:
    name: Deploy ${{ matrix.subject }}
    needs: [engine, integrity, secrets-present]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.secrets-present.outputs.ready == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        subject: [php, java, kafka]
    # Queued, not cancelled. Two pushes in quick succession should publish in
    # the order they were made; cancel-in-progress would let the older one win
    # if it happened to finish uploading after the newer was killed.
    concurrency:
      group: deploy-${{ matrix.subject }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: npx wrangler deploy — subjects/${{ matrix.subject }}
        working-directory: subjects/${{ matrix.subject }}
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Major pinned. `npx wrangler` unpinned would take a v5 the day it ships,
        # on a repository whose entire premise is having no build step to break.
        run: npx --yes wrangler@4 deploy

  # Placeholders for the remaining blueprint §8 jobs. They are listed rather
  # than silently absent so the gap is visible in the CI tab, not just in prose.
  #
  #   unit          — PHPUnit against src/          (phase 7)
  #   integration   — PHPUnit + Testcontainers      (phase 7)
  #   labs-must-fail— the graded exercises stay red (phase 7)
  #   audit         — composer audit                (phase 7)
  #   mutation      — infection, weekly             (phase 7)
